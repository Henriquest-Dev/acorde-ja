plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'pt.acordeja'
version = '0.1.0'

expoModule {
  v2 true
}

android {
  namespace "pt.acordeja.nativemodule"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
  // org.json real nos testes JVM (no Android é fornecido pela plataforma).
  testImplementation 'org.json:json:20240303'
}
